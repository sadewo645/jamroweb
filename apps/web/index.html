<!DOCTYPE html>
<html lang="en" data-theme="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        theme: {
          extend: {

            colors: {

                100: '#dcefe6',

                600: '#126548',

  <body class="bg-slate-950 text-slate-100 font-sans">
